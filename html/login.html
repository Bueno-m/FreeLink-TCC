<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeLink | Login</title>
  <link rel="stylesheet" href="../css/Style.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- NAVEGAÇÃO / HEADER -->
  <header class="navbar">
    <div class="logo">
      <a href="index.html"><img src="../logo-light.svg" alt="FreeLink" class="brand-logo"></a>
      <button class="nav-toggle" aria-label="Abrir menu"><i class="fa-solid fa-bars"></i></button>
    </div>
    <nav class="nav-links">
      <a href="configuracoes.html">Configurações</a>
      <a href="index.html">Início</a>
      <a href="postar-trabalho.html">Postar Projeto</a>
      <a href="perfil.html">Meu Perfil</a>
    </nav>
    <div class="auth-buttons" id="auth-buttons-container">
      <a href="login.html" class="btn-login">Entrar</a>
      <a href="registro.html" class="btn-register">Cadastrar</a>
    </div>
  </header>

  <div class="page-shell">
    <div class="login-card">
      <div class="brand">
        <img src="../logo-light.svg" alt="Logo FreeLink" class="brand-logo">
      </div>

      <div class="login-header">
        <h1>Entrar</h1>
        <p>Bem-vindo de volta ao FreeLink</p>
      </div>

      <form id="form-login" class="login-form">
        <label class="input-group">
          <span>E-mail</span>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="login-email" placeholder="seuemail@email.com" required>
          </div>
        </label>

        <label class="input-group">
          <span>Senha</span>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-senha" placeholder="Sua senha" required>
          </div>
        </label>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="login-lembrar">
            <span>Lembrar-me</span>
          </label>
          <a href="#" onclick="alert('Dica para apresentação do TCC: utilize seu e-mail cadastrado ou crie uma conta em Cadastre-se!'); return false;">Esqueci a senha</a>
        </div>

        <button type="submit" class="login-btn">Entrar</button>
      </form>

      <div class="divider">
        <span>ou</span>
      </div>

      <button type="button" class="social-btn" onclick="alert('Simulação de login social: Para o TCC, utilize o formulário acima que salva e valida diretamente no LocalStorage!');">
        <i class="fa-brands fa-google"></i>
        Continuar com Google
      </button>

      <p class="register-text">
        Não tem uma conta? <a href="registro.html">Cadastre-se</a>
      </p>
    </div>
  </div>
  <script src="../js/main.js"></script>
</body>
</html>
