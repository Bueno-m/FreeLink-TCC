    <path d="M 24 20 L 50 20 C 53 20 56 23 56 26 L 56 34 C 56 37 53 40 50 40 L 32 40 L 32 48 L 48 48 C 51 48 53 50 53 53 L 53 56 L 24 56 C 20 56 18 53 18 49 L 18 27 C 18 23 20 20 24 20 Z" fill="#ffffff" />
